name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: suits_companion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d suits_companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Suits Companion API
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/suits_companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run linting
        working-directory: backend
        run: python -m ruff check .

      - name: Check formatting
        working-directory: backend
        run: python -m ruff format --check .

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest
