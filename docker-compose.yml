services:
  postgres:
    image: postgres:17
    container_name: suits-postgres
    environment:
      POSTGRES_DB: suits_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: suits-backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/suits_companion
    ports:
      - "8000:8000"

volumes:
  postgres_data: